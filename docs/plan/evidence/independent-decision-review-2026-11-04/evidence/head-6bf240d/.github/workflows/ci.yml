name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aftervia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aftervia_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag v4, ghim 2026-11-01 (WO24-01)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag v4, ghim 2026-11-01 (WO24-01)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
