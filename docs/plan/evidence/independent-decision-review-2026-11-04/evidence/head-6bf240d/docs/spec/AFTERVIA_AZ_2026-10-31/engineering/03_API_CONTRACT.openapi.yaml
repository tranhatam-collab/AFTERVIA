components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    Item:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        purchased_on:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          nullable: true
    ItemInput:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        purchased_on:
          type: string
          format: date
          nullable: true
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          nullable: true
    Case:
      type: object
      required:
      - id
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - draft
          - submitted
          - triaged
          - waiting_customer
          - waiting_merchant
          - waiting_partner
          - in_progress
          - resolved
          - closed
          - withdrawn
        version:
          type: integer
          minimum: 1
    CaseInput:
      type: object
      additionalProperties: false
      required:
      - item_id
      - organization_id
      - description
      - shared_document_ids
      properties:
        item_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 4000
        shared_document_ids:
          type: array
          items:
            type: string
            format: uuid
    Transition:
      type: object
      additionalProperties: false
      required:
      - next_state
      - reason
      - expected_version
      properties:
        next_state:
          type: string
        reason:
          type: string
          minLength: 1
        expected_version:
          type: integer
        evidence_document_ids:
          type: array
          items:
            type: string
            format: uuid
    UploadRequest:
      type: object
      additionalProperties: false
      required:
      - mime
      - size_bytes
      - sha256
      properties:
        mime:
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    UploadTicket:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Job:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
    GrantInput:
      type: object
      additionalProperties: false
      required:
      - document_id
      - recipient_id
      - expires_at
      - can_download
      properties:
        document_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        can_download:
          type: boolean
    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
          - active
          - revoked
          - expired
    JobRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
        confirmation_token:
          type: string
    Review:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - confirmed_fields
      properties:
        schema_version:
          type: string
        confirmed_fields:
          type: object
          description: Validated field names/values; not arbitrary SQL or instructions
