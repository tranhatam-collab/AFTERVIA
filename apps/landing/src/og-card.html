<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AFTERVIA og card</title>
<!-- Mẫu ảnh chia sẻ 1200x630 cho public/og-image.png. Không được build vào trang; chỉ chụp lại khi đổi thương hiệu. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: #142B36;
    color: #F6F8FA;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif;
  }
  .mark { font-size: 26px; font-weight: 800; letter-spacing: 0.12em; }
  h1 { margin: 0; font-size: 92px; line-height: 1.02; font-weight: 750; letter-spacing: -0.02em; }
  .en { margin: 18px 0 0; font-size: 40px; font-weight: 500; color: #B7E6EE; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #AFC2CC; }
  .pill { padding: 10px 18px; border: 2px solid #3FB3C4; border-radius: 999px; color: #B7E6EE; }
</style>
</head>
<body>
  <div class="mark">AFTERVIA</div>
  <div>
    <h1>Sau mua, luôn rõ.</h1>
    <p class="en" lang="en">Clarity after every purchase.</p>
  </div>
  <div class="foot">
    <span class="pill">Đang phát triển · chưa mở bán</span>
    <span lang="en">In development · not yet on sale</span>
  </div>
</body>
</html>
