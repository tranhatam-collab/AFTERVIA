<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AFTERVIA og card</title>
<!-- Mẫu ảnh chia sẻ 1200x630 cho public/og-image.png. Không được build vào trang; chỉ chụp lại khi đổi thương hiệu. -->
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    src: url(../public/fonts/inter-latin-wght-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    src: url(../public/fonts/inter-vietnamese-wght-normal.woff2) format('woff2');
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    background: #0F4D3A;
    color: #F8FAF7;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; letter-spacing: 0.12em; }
  .brand svg { width: 56px; height: 56px; }
  .tagline { margin: 0 0 22px; font-size: 22px; font-weight: 700; letter-spacing: 0.3em; color: #BBF7D0; }
  h1 { margin: 0; font-size: 84px; line-height: 1.04; font-weight: 750; letter-spacing: -0.02em; max-width: 1000px; }
  .en { margin: 18px 0 0; font-size: 38px; font-weight: 500; color: #BBF7D0; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #BBF7D0; }
  .pill { padding: 10px 18px; border: 2px solid #22C55E; border-radius: 999px; color: #F8FAF7; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <rect width="64" height="64" rx="14" fill="#0F4D3A"/>
      <path d="M14 50 L32 14 L50 50" fill="none" stroke="#F8FAF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 39 C 27 31, 36 31, 43 37 C 38 43, 29 44, 21 39 Z" fill="#22C55E"/>
    </svg>
    <span>AFTERVIA</span>
  </div>
  <div>
    <p class="tagline">THINGS LIVE LONGER</p>
    <h1>Quản lý hậu mãi để mọi thứ bền lâu.</h1>
    <p class="en" lang="en">Manage aftercare. Make things last longer.</p>
  </div>
  <div class="foot">
    <span class="pill">Đang phát triển · chưa mở bán</span>
    <span lang="en">In development · not yet on sale</span>
  </div>
</body>
</html>
